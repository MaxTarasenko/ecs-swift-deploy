name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [[ -n "$out" ]]; then echo "unformatted: $out" >&2; exit 1; fi
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race -count=1 ./...
      - run: bash scripts/build-release.sh

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already released; bump VERSION to publish a new release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: '1.27.1'
      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: bash scripts/build-release.sh
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md dist/*
